# Load balancer: spreads players across the three game servers.
events {}

http {
  # Docker's internal DNS. Re-resolve server names so a restarted container's new
  # address is picked up without restarting nginx.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream poker {
    zone poker 64k;
    # Round-robin. A server that refuses connections is skipped for 10s.
    server server-1:3001 resolve max_fails=1 fail_timeout=10s;
    server server-2:3001 resolve max_fails=1 fail_timeout=10s;
    server server-3:3001 resolve max_fails=1 fail_timeout=10s;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://poker;
      # WebSocket upgrade.
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Game connections stay open for hours.
      proxy_read_timeout 1h;
      # If a server is down, try the next one instead of failing the player.
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout;
    }
  }
}
